# SYNAX AI — local infrastructure
#
#   docker compose up -d
#
# Brings up MongoDB for local development. The API and web client run on the
# host (see README) so hot reload works normally.

services:
  mongo:
    image: mongo:7
    container_name: synax-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - synax-mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  synax-mongo-data:
